[project]
name = "loan-draw"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "langgraph>=1.0",
    "litellm>=1.70",
    "mcp>=1.10",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-sdk>=1.27",
    "pydantic>=2.9",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
retrieval = [
    "fastembed>=0.4",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
