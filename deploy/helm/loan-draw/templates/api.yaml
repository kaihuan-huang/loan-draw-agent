apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: {{ .Release.Name }}-state}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: {{ .Values.state.size }}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Release.Name }}-api, labels: {app: {{ .Release.Name }}-api}}
spec:
  replicas: 1   # one writer: the ledger and checkpoints are SQLite on one volume
  strategy: {type: Recreate}
  selector: {matchLabels: {app: {{ .Release.Name }}-api}}
  template:
    metadata: {labels: {app: {{ .Release.Name }}-api}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - {name: MCP_URL, value: "http://{{ .Release.Name }}-mcp:8765/mcp"}
            - {name: LLM_MODEL, value: {{ .Values.llm.model | quote }}}
            - {name: LLM_API_BASE, value: {{ .Values.llm.apiBase | quote }}}
            - {name: LLM_CASSETTE, value: {{ .Values.llm.cassette | quote }}}
            - {name: LLM_CASSETTE_PATH, value: /app/evals/cassettes/qwen2.5-7b.jsonl}
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health, port: 8000}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8000}, periodSeconds: 20}
          volumeMounts: [{name: state, mountPath: /state}]
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
      volumes: [{name: state, persistentVolumeClaim: {claimName: {{ .Release.Name }}-state}}]
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}-api}
spec:
  type: NodePort
  selector: {app: {{ .Release.Name }}-api}
  ports: [{port: 8000, targetPort: 8000, nodePort: {{ .Values.api.nodePort }}}]
